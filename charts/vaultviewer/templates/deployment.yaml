{{- $ldapSecretName := .Values.ldap.existingSecret | default (printf "%s-ldap" (include "vaultviewer.fullname" .)) -}}
{{- $ldapSecretKey := .Values.ldap.existingSecretKey -}}
{{- if not .Values.ldap.existingSecret -}}
{{- if not .Values.ldap.bindPasswordValue -}}
{{- fail "Set ldap.existingSecret (recommended) or ldap.bindPasswordValue so the LDAP bind password can be provided — AccessLens refuses to hardcode it." -}}
{{- end -}}
{{- end -}}
{{- if .Values.backup.enabled -}}
{{- if ne .Values.mode "local" -}}
{{- fail "backup.enabled is only supported when mode: local (it mirrors the mounted directory; cluster mode's data already lives in Kubernetes Secrets)." -}}
{{- end -}}
{{- if not .Values.backup.existingSecret -}}
{{- fail "Set backup.existingSecret so the S3 access/secret key can be provided — AccessLens refuses to hardcode it." -}}
{{- end -}}
{{- end -}}
{{- if .Values.autoscaling.enabled -}}
{{- if and (eq .Values.mode "local") .Values.local.persistence.enabled -}}
{{- fail "autoscaling.enabled isn't compatible with mode: local + local.persistence.enabled — a ReadWriteOnce PVC can only be mounted by one pod at a time. Use mode: cluster, or disable local.persistence if your storage supports ReadWriteMany." -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultviewer.fullname" . }}
  labels:
    {{- include "vaultviewer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if and (eq .Values.mode "local") .Values.local.persistence.enabled }}
  # A ReadWriteOnce PVC can only be attached to one pod at a time — a
  # rolling update would leave the new pod stuck waiting to attach it while
  # the old one is still terminating. Recreate avoids that by tearing down
  # first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "vaultviewer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vaultviewer.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "vaultviewer.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: accesslens
          image: "{{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ACCESSLENS_MODE
              value: {{ .Values.mode | required "mode must be \"local\" or \"cluster\"" | quote }}
            - name: ACCESSLENS_DEPLOYMENT_LABEL
              value: {{ .Values.deploymentLabel | quote }}
            {{- if eq .Values.mode "local" }}
            - name: VAULT_LOCAL_ROOT
              value: {{ .Values.local.persistence.mountPath | quote }}
            - name: ACCESSLENS_GIT_ENABLED
              value: {{ dig "git" "enabled" false .Values.local | quote }}
            {{- else if eq .Values.mode "cluster" }}
            - name: ACCESSLENS_K8S_NAMESPACE
              value: {{ include "vaultviewer.clusterNamespace" . | quote }}
            {{- end }}
            - name: ACCESSLENS_LDAP_HOST
              value: {{ .Values.ldap.host | required "ldap.host is required" | quote }}
            - name: ACCESSLENS_LDAP_PORT
              value: {{ .Values.ldap.port | quote }}
            - name: ACCESSLENS_LDAP_TLS
              value: {{ .Values.ldap.tls | quote }}
            - name: ACCESSLENS_LDAP_BASE_DN
              value: {{ .Values.ldap.baseDN | required "ldap.baseDN is required" | quote }}
            - name: ACCESSLENS_LDAP_USER_OU
              value: {{ .Values.ldap.userOU | quote }}
            - name: ACCESSLENS_LDAP_GROUP_OU
              value: {{ .Values.ldap.groupOU | quote }}
            - name: ACCESSLENS_LDAP_BIND_DN
              value: {{ .Values.ldap.bindDN | required "ldap.bindDN is required" | quote }}
            - name: ACCESSLENS_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ldapSecretName }}
                  key: {{ $ldapSecretKey }}
            {{- range $role, $groups := .Values.ldap.groupRoleMap }}
            - name: {{ printf "ACCESSLENS_LDAP_GROUP_%s" ($role | upper) }}
              {{- /* 값이 리스트면 콤마로 합쳐서 하나의 env var로 전달 (여러 LDAP 그룹 -> 같은 역할) */}}
              value: {{ (kindIs "slice" $groups) | ternary (join "," $groups) $groups | quote }}
            {{- end }}
            {{- if .Values.ldap.groupSearchFilter }}
            - name: ACCESSLENS_LDAP_GROUP_SEARCH_FILTER
              value: {{ .Values.ldap.groupSearchFilter | quote }}
            {{- end }}
            {{- if .Values.session.existingSecret }}
            - name: ACCESSLENS_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.session.existingSecret }}
                  key: {{ .Values.session.existingSecretKey }}
            {{- end }}
            - name: ACCESSLENS_SESSION_TTL_HOURS
              value: {{ .Values.session.ttlHours | quote }}
            {{- if .Values.cors.origin }}
            - name: ACCESSLENS_CORS_ORIGIN
              value: {{ .Values.cors.origin | quote }}
            {{- end }}
            {{- if .Values.backup.enabled }}
            - name: ACCESSLENS_S3_ENDPOINT
              value: {{ .Values.backup.endpoint | required "backup.endpoint is required when backup.enabled=true" | quote }}
            - name: ACCESSLENS_S3_BUCKET
              value: {{ .Values.backup.bucket | required "backup.bucket is required when backup.enabled=true" | quote }}
            - name: ACCESSLENS_S3_REGION
              value: {{ .Values.backup.region | quote }}
            - name: ACCESSLENS_S3_USE_SSL
              value: {{ .Values.backup.useSSL | quote }}
            - name: ACCESSLENS_S3_PREFIX
              value: {{ .Values.backup.prefix | default (include "vaultviewer.fullname" .) | quote }}
            - name: ACCESSLENS_BACKUP_INTERVAL_MINUTES
              value: {{ .Values.backup.intervalMinutes | quote }}
            - name: ACCESSLENS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backup.existingSecret }}
                  key: {{ .Values.backup.existingSecretAccessKeyKey }}
            - name: ACCESSLENS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backup.existingSecret }}
                  key: {{ .Values.backup.existingSecretSecretKeyKey }}
            {{- end }}
            {{- if .Values.trino.endpoint }}
            - name: ACCESSLENS_TRINO_ENDPOINT
              value: {{ .Values.trino.endpoint | quote }}
            - name: ACCESSLENS_TRINO_INSECURE_SKIP_VERIFY
              value: {{ .Values.trino.insecureSkipVerify | quote }}
            - name: ACCESSLENS_TRINO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.trino.existingSecret | required "trino.existingSecret is required when trino.endpoint is set" }}
                  key: {{ .Values.trino.existingSecretUsernameKey }}
            - name: ACCESSLENS_TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.trino.existingSecret }}
                  key: {{ .Values.trino.existingSecretPasswordKey }}
            {{- range $role, $label := .Values.trino.roleMap }}
            - name: {{ printf "ACCESSLENS_TRINO_ROLE_%s" ($role | upper) }}
              value: {{ $label | quote }}
            {{- end }}
            - name: ACCESSLENS_TRINO_CATALOGS
              value: {{ join "," .Values.trino.catalogs | quote }}
            {{- end }}
            {{- if .Values.opa.endpoint }}
            - name: ACCESSLENS_OPA_ENDPOINT
              value: {{ .Values.opa.endpoint | quote }}
            {{- range $role, $group := .Values.opa.groupMap }}
            - name: {{ printf "ACCESSLENS_OPA_GROUP_%s" ($role | upper) }}
              value: {{ $group | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.s3iam.endpoint }}
            - name: ACCESSLENS_S3IAM_ENDPOINT
              value: {{ .Values.s3iam.endpoint | quote }}
            - name: ACCESSLENS_S3IAM_LDAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3iam.existingSecret | required "s3iam.existingSecret is required when s3iam.endpoint is set" }}
                  key: {{ .Values.s3iam.existingSecretUsernameKey }}
            - name: ACCESSLENS_S3IAM_LDAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3iam.existingSecret }}
                  key: {{ .Values.s3iam.existingSecretPasswordKey }}
            {{- range $role, $label := .Values.s3iam.roleMap }}
            - name: {{ printf "ACCESSLENS_S3IAM_ROLE_%s" ($role | upper) }}
              value: {{ $label | quote }}
            {{- end }}
            - name: ACCESSLENS_S3IAM_BUCKETS
              value: {{ join "," .Values.s3iam.buckets | quote }}
            {{- end }}
          {{- if and (eq .Values.mode "local") .Values.local.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.local.persistence.mountPath }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if and (eq .Values.mode "local") .Values.local.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.local.persistence.existingClaim | default (printf "%s-data" (include "vaultviewer.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
