{{/*
Only rendered as a fallback for quick local testing when the LDAP bind
password is given inline via values (ldap.bindPasswordValue) instead of an
existingSecret. Prefer existingSecret for anything real — a value baked
into a rendered manifest or values file is a hardcoded credential.
*/}}
{{- if and (not .Values.ldap.existingSecret) .Values.ldap.bindPasswordValue -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultviewer.fullname" . }}-ldap
  labels:
    {{- include "vaultviewer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.ldap.existingSecretKey }}: {{ .Values.ldap.bindPasswordValue | quote }}
{{- end -}}
