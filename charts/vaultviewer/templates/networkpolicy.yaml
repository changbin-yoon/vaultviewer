{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaultviewer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vaultviewer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vaultviewer.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  {{- if .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  {{- else }}
  # No rules supplied — allow ingress from anywhere on the http port, i.e.
  # the same effective behavior as no NetworkPolicy at all. Fill in
  # networkPolicy.ingress to actually restrict traffic.
  ingress:
    - ports:
        - port: http
          protocol: TCP
  {{- end }}
{{- end -}}
