{{- if and (eq .Values.mode "cluster") .Values.cluster.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vaultviewer.fullname" . }}-secrets
  namespace: {{ include "vaultviewer.clusterNamespace" . }}
  labels:
    {{- include "vaultviewer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vaultviewer.fullname" . }}-secrets
  namespace: {{ include "vaultviewer.clusterNamespace" . }}
  labels:
    {{- include "vaultviewer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vaultviewer.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "vaultviewer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
