# Default values for AccessLens (Helm chart machine name stays "vaultviewer" —
# see README for why).

image:
  # airgapped 클러스터용 프라이빗 레지스트리 미러 — 비워두면 기존처럼
  # repository를 그대로 씀(Docker Hub). 예: "harbor.internal:5000"으로
  # 채우면 harbor.internal:5000/yoochabi/vaultviewer:<tag>를 사용.
  registry: ""
  repository: yoochabi/vaultviewer
  tag: "0.1.49"
  pullPolicy: IfNotPresent

# airgapped 클러스터의 프라이빗 레지스트리가 인증을 요구하면 여기에
# imagePullSecret 이름을 추가 (kubectl create secret docker-registry로 미리
# 생성해둔 시크릿).
imagePullSecrets: []

replicaCount: 1

# ACCESSLENS_MODE: how the server reads/writes secrets.
#   local   — a directory mounted into the container (see `local.persistence`).
#   cluster — Kubernetes Secrets in `cluster.namespace`, via the pod's own
#             service account (see `cluster.rbac`).
mode: local

# UI 배지 텍스트 (앱 이름 옆, 좌측 상단). `mode`(스토리지 백엔드)와는 별개 개념 —
# mode: local이어도 실제로는 쿠버네티스에 떠 있을 수 있으므로, "어디서 돌고 있는지"를
# 보여주는 용도로 분리했다. 여러 클러스터에 배포한다면 클러스터 이름으로 바꿔서 구분
# 가능 (예: "CLUSTER-PROD"). 로컬 바이너리/도커로 띄우면(이 값을 안 건드리면) "LOCAL".
deploymentLabel: "CLUSTER"

# -- LOCAL mode --------------------------------------------------------
local:
  persistence:
    enabled: true
    # Set to reuse an existing PVC instead of letting the chart create one.
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /data
  git:
    # Makes the mounted directory a real git repository — every save/delete
    # is also committed there (author = the acting user, committer = a
    # fixed "AccessLens" service identity). Local-repo only, no push to a
    # remote. Off by default; existing audit log/history behavior is
    # unchanged either way — this runs alongside it, not instead of it.
    enabled: false

# -- CLUSTER mode --------------------------------------------------------
cluster:
  # Namespace whose Secrets are browsed/edited. Defaults to the release
  # namespace when empty.
  namespace: ""
  rbac:
    # Grants the pod's ServiceAccount get/list/create/update/delete on
    # Secrets in `cluster.namespace` — required for cluster mode to work.
    create: true

# -- LDAP authentication -------------------------------------------------
# Every AccessLens role (adm/dev/view) is resolved from LDAP group
# membership; see internal/auth/config.go. Values here map 1:1 to the
# server's ACCESSLENS_LDAP_* environment variables.
ldap:
  host: ""
  port: 389
  tls: false
  baseDN: ""
  userOU: "ou=users"
  groupOU: "ou=groups"
  bindDN: ""

  # Bind password — prefer existingSecret over bindPasswordValue. A value
  # checked into a values file is a hardcoded credential; existingSecret
  # keeps it out of the chart entirely.
  existingSecret: ""
  existingSecretKey: "bind-password"
  # Only for quick local testing — leave empty and use existingSecret above
  # for anything real.
  bindPasswordValue: ""

  # LDAP group CN -> AccessLens role. Change the values (not the keys) to
  # match your directory's actual group names. Each value may be a single
  # string or a list — a list maps multiple LDAP groups onto the same role
  # (e.g. both "dt-bi-adm" and "platform-admins" granting adm).
  groupRoleMap:
    adm: "adm"
    dev: "dev"
    view: "view"
    # 여러 LDAP 그룹을 같은 역할에 매핑하고 싶다면 리스트로 작성:
    # adm:
    #   - "dt-bi-adm"
    #   - "platform-admins"

  # 그룹 검색 자체에 쓰이는 LDAP 필터 템플릿 (Trino의 ldap.group-search-filter와
  # 동일한 목적) — 사용자의 그룹 멤버십을 어떤 스키마로 찾을지 결정합니다.
  # groupRoleMap과는 별개: 이 필터가 "어떤 그룹들을 찾을지"를, groupRoleMap이
  # "찾은 그룹을 어떤 역할로 매핑할지"를 담당합니다. 비워두면 서버가 지금까지
  # 써온 필터(groupOfNames member 매칭)를 그대로 사용해 기존 배포는 영향 없음.
  # 사용 가능한 필드: {{.UserDN}}, {{.UID}} (둘 다 자동으로 LDAP 필터 이스케이프됨)
  groupSearchFilter: ""
  # 예시:
  # posixGroup (memberUid) 스키마:
  #   groupSearchFilter: "(&(objectClass=posixGroup)(memberUid={{.UID}}))"
  # groupOfUniqueNames (uniqueMember) 스키마:
  #   groupSearchFilter: "(&(objectClass=groupOfUniqueNames)(uniqueMember={{.UserDN}}))"
  # Active Directory 중첩 그룹 (LDAP_MATCHING_RULE_IN_CHAIN):
  #   groupSearchFilter: "(member:1.2.840.113556.1.4.1941:={{.UserDN}})"

# -- Session tokens --------------------------------------------------------
session:
  # HMAC signing key for session tokens. If neither existingSecret nor a
  # generated one is provided, the server falls back to a random ephemeral
  # key at startup — sessions won't survive a pod restart. Set an
  # existingSecret for persistent sessions across restarts/rollouts.
  existingSecret: ""
  existingSecretKey: "session-secret"
  ttlHours: 8

# -- S3/MinIO 백업 --------------------------------------------------------
# mode: local일 때만 적용됨 (마운트된 디렉토리를 그대로 미러링하는 방식이라 —
# cluster 모드는 데이터가 이미 Kubernetes Secret/etcd에 있어서 대상이 아님).
# enabled: false가 기본값이라 아무것도 설정 안 하면 완전히 비활성 상태.
backup:
  enabled: false
  # MinIO/S3 엔드포인트, 예: "minio.minio-system.svc.cluster.local:9000"
  endpoint: ""
  bucket: ""
  region: "us-east-1"
  useSSL: false
  # 버킷 안에서 이 릴리스 데이터를 구분할 접두사. 비워두면 릴리스 이름을 사용 —
  # 같은 버킷을 여러 AccessLens 릴리스가 공유해도 서로 덮어쓰지 않음.
  prefix: ""
  # 몇 분마다 동기화할지. 그날 날짜 프리픽스(YYYY-MM-DD) 아래에서 바뀌었거나
  # 새로 생긴 파일만 업로드함(로컬 MD5 vs S3 ETag 비교) — 지난 날짜의 백업은
  # 절대 건드리지 않음(=날짜별로 독립된 복구 지점).
  intervalMinutes: 30
  # Access Key/Secret Key는 여기 직접 쓰지 말고 미리 Secret으로 만들어서
  # existingSecret으로 참조할 것 (ldap.existingSecret과 동일한 패턴).
  existingSecret: ""
  existingSecretAccessKeyKey: "access-key"
  existingSecretSecretKeyKey: "secret-key"

# -- Trino 대시보드 카드 (연결 확인 + 역할/카탈로그 표시) -------------------
# 스토리지 모드와 무관하게 동작하는 순수 상태 카드 — Trino의 GRANT를 직접
# 조회하지 않고, 여기서 설정한 role/catalog 라벨을 그대로 보여줌. endpoint를
# 비워두면(기본값) 완전히 비활성 — 대시보드는 기존 "연동 예정" 카드를 보여줌.
trino:
  # coordinator host:port, 예: "trino.example.svc.cluster.local:8443".
  # 항상 HTTPS로 접속함 (Trino PASSWORD 인증은 평문 HTTP를 기본 거부).
  endpoint: ""
  # coordinator가 자체 서명 인증서를 쓰면 true — 알려진 테스트/내부
  # 환경에서만 켤 것.
  insecureSkipVerify: false
  # Username/Password는 여기 직접 쓰지 말고 미리 Secret으로 만들어서
  # existingSecret으로 참조할 것 (ldap.existingSecret과 동일한 패턴).
  existingSecret: ""
  existingSecretUsernameKey: "username"
  existingSecretPasswordKey: "password"
  # AccessLens 역할(adm/dev/view) -> 대시보드에 보여줄 Trino 역할 라벨.
  # 기본값은 그대로 재사용(추가 설정 없이 바로 동작).
  roleMap:
    adm: "adm"
    dev: "dev"
    view: "view"
  # 대시보드에 표시할 카탈로그 이름 목록 (Trino에서 라이브 조회하지 않음).
  catalogs: []

# -- OPA 대시보드 카드 (LDAP 그룹 -> grants 라이브 조회) --------------------
# Trino가 접근 제어에 쓰는 것과 같은 OPA를 그대로 조회 — 팀/카탈로그/허용
# operation을 여기 Helm values에 다시 적지 않고, OPA의 현재 grants 문서에서
# 그대로 읽어옴 (internal/opa). endpoint를 비워두면(기본값) 완전히 비활성.
# 인증 없음 — Trino 자신도 이 OPA를 인증 없이 호출함.
opa:
  # 예: "opa.trino-verify.svc.cluster.local:8181". 항상 HTTP로 접속.
  endpoint: ""
  # AccessLens 역할(adm/dev/view) -> OPA 쪽 LDAP 그룹 이름. 매핑 안 된
  # 역할은 조회 결과가 빈 배열(grants 없음)로 정직하게 표시됨.
  groupMap:
    adm: ""
    dev: ""
    view: ""

# -- S3 IAM 대시보드 카드 (LDAP 서비스 계정으로 연결 확인) -------------------
# S3 호환 엔드포인트(MinIO 등)의 LDAP 아이덴티티 공급자에 고정 서비스
# 계정으로 AssumeRoleWithLDAPIdentity를 호출해 연결만 확인 — Trino 카드와
# 같은 패턴(role/bucket은 실 정책 조회가 아니라 여기 설정한 라벨). endpoint를
# 비워두면(기본값) 완전히 비활성.
s3iam:
  # S3 API host:port, 예: "minio.example.svc.cluster.local:9000". 항상
  # HTTP로 접속 (TLS 없는 배포 기준).
  endpoint: ""
  # LDAP 서비스 계정 — 여기 직접 쓰지 말고 미리 Secret으로 만들어서
  # existingSecret으로 참조할 것 (ldap.existingSecret과 동일한 패턴).
  existingSecret: ""
  existingSecretUsernameKey: "ldapUsername"
  existingSecretPasswordKey: "ldapPassword"
  # AccessLens 역할(adm/dev/view) -> 대시보드에 보여줄 라벨. 기본값은 그대로
  # 재사용(추가 설정 없이 바로 동작).
  roleMap:
    adm: "adm"
    dev: "dev"
    view: "view"
  # 대시보드에 표시할 버킷 이름 목록 (S3에서 라이브 조회하지 않음).
  buckets: []

# -- Networking --------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  # Only used when type: NodePort. Leave empty to let Kubernetes assign a
  # random port from the cluster's nodePort range (changes on every
  # uninstall/reinstall) — set it to pin a stable port instead.
  nodePort: ""

# Origin allowed to call the API cross-origin (only relevant if you run the
# frontend separately from this server; the default same-origin deployment
# doesn't need this).
cors:
  origin: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: accesslens.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

# No CPU limit on purpose — a Go process throttled by the CFS scheduler
# under a CPU limit shows up as latency spikes, not smooth slowdown; the
# CPU request alone is enough for the scheduler to place the pod sanely.
# The memory limit *is* set, since an OOM-killed pod is much easier to
# recover from than one left free to pressure the node.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# -- Native Kubernetes extras (all opt-in, default off) --------------------
# Every flag below defaults to disabled so `helm upgrade` on an existing
# release renders identically to before these were added — enable
# deliberately per-environment via a values override, not by changing this
# file's defaults.

# Adds a startupProbe (reusing /healthz) so a slow-starting pod (e.g. a cold
# PVC mount) gets a longer grace period before liveness starts counting
# failures, without loosening the liveness probe's own timing once started.
startupProbe:
  enabled: false
  failureThreshold: 30
  periodSeconds: 2

# Restricts which pods/namespaces may reach this pod's port. Leave `ingress`
# empty to allow from anywhere on the http port (same effective behavior as
# no NetworkPolicy at all) — only real hardening once you fill in `ingress`
# with your own rules (namespaceSelector/podSelector/ipBlock).
networkPolicy:
  enabled: false
  policyTypes: ["Ingress"]
  ingress: []

# Guarantees at least this many pods stay up during a voluntary disruption
# (node drain, cluster upgrade). Requires replicaCount >= 2 (or
# autoscaling.minReplicas >= 2) — with a single replica, minAvailable: 1
# would block every voluntary eviction of that one pod, including node
# drains; the chart refuses to render this combination.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Only meaningful for mode: cluster (stateless) — mode: local's data lives
# on a single ReadWriteOnce PVC, so more than one replica can't mount it at
# once (see the Deployment's `strategy: Recreate` above); the chart refuses
# to render autoscaling combined with mode: local persistence.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
